milestones:
  - id: P0
    title: Verified control baseline and product truth
    exit: CTRL-003, TRUTH-001, and REUSE-001 are source_tested on an exact commit and CTRL-004 is approved by Riley
  - id: P1
    title: Complete visible messaging and A2A
    exit: all P1 acceptance rows pass with real browser/native behavior and exact publication receipts
  - id: P2
    title: Projects, rooms, Inbox, Activity, native agents, and app UX
    exit: all P2 surfaces and failure/relaunch states work together without mock-data claims
  - id: P3
    title: Installed functional-beta demo
    exit: one unchanged source commit passes installed proof and is approved for luca/v1-beta promotion
  - id: P4
    title: Mnemos felt continuity and identity
    exit: native-runtime-authored continuity is private, attributable, revisable, and fail-soft
  - id: P5
    title: Optional security hardening and deferred product expansion
    exit: each separately activated task meets its own acceptance contract

