schema_version: 1
project: luca-agent-network-v1
phase: G2
branch: agent/continuity-g2
baseline_commit: 4781dca6
source_authority: docs/luca/continuity-audit
max_parallel_write_lanes: 3
max_spawn_depth: 1
repair_policy:
  max_evidence_based_repairs: 1
  repeated_environment_failure: stop_and_record
lanes:
  control:
    owns:
      - docs/luca/continuity-g2
      - evidence/G2
      - scripts/luca/validate_g2_control.py
      - Cargo.toml
      - Cargo.lock
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/src/lib.rs
      - HANDOFF.md
  protocol_storage:
    owns:
      - crates/luca-protocol
      - crates/luca-continuity
      - schemas/luca/continuity
      - tests/luca-conformance/continuity
  runtime_cognition:
    owns:
      - crates/buzz-acp
      - desktop/src-tauri/src/luca/continuity
      - desktop/src-tauri/src/luca/cognition
  import_frontend:
    owns:
      - desktop/src-tauri/src/luca/imports
      - desktop/src/features/luca/continuity
      - desktop/src/features/luca/brain
      - desktop/src/features/luca/imports
      - desktop/src/features/luca/onboarding
global_rules:
  - conversation_and_final_publication_never_depend_on_continuity
  - signed_events_are_canonical_chronology_and_authorship
  - resident_public_keys_are_canonical_identity
  - resident_private_namespaces_never_cross_residents
  - room_membership_never_grants_memory_access
  - owner_brain_recall_requires_current_persisted_egress_grant
  - pre_turn_retrieval_performs_zero_persistent_mutations
  - post_turn_jobs_begin_only_after_exact_final_event_is_durable
  - retrieved_and_imported_content_is_untrusted_reference_material
  - reference_repositories_and_native_configuration_are_read_only
  - no_private_bodies_or_keys_in_logs_evidence_wal_or_crash_reports
  - scheduled_cognition_is_opt_in_bounded_and_tool_denied
  - no_conductor
gates:
  - id: G2.0
    title: Durable control plane
    tasks: [C00, C01, C02]
    barrier_task: C02
  - id: G2.1
    title: Conversation and protocol parity
    tasks: [P01, P02, P03, P04]
    barrier_task: P04
  - id: G2.2
    title: Encrypted continuity kernel
    tasks: [K01, K02, K03, K03D, K04, K05, K06]
    barrier_task: K06
  - id: G2.3
    title: Turn continuity and durable writes
    tasks: [T01, T02, T03, T03D, T04, T05]
    barrier_task: T05
  - id: G2.4
    title: Universal brain and imports
    tasks: [B01, B01D, B02, B03, B04, B05]
    barrier_task: B05
  - id: G2.5
    title: Bounded scheduled inner life
    tasks: [I01, I02, I03, I04]
    barrier_task: I04
  - id: G2.6
    title: Integrated native gate
    tasks: [N01, N02, N03]
    barrier_task: N03
tasks:
  - id: C00
    gate: G2.0
    title: Create exact-baseline isolated branch and worktree
    depends_on: []
    lane: control
    risk: high
    owner_role: integration_lead
    reviewer_role: independent_reviewer
    outputs: [pushed_branch, isolated_worktree, source_preservation_record]
    checks: [git_branch_and_head, git_worktree_inventory, remote_reachability]
    acceptance: [A001, A002]
  - id: C01
    gate: G2.0
    title: Install durable control package and evidence system
    depends_on: [C00]
    lane: control
    risk: high
    owner_role: integration_lead
    reviewer_role: independent_reviewer
    outputs: [build_spec, task_graph, acceptance_matrix, decision_ledger, run_log, receipt_template]
    checks: [control_validator, audit_checksum_verification]
    acceptance: [A003, A004]
  - id: C02
    gate: G2.0
    title: Freeze interfaces, ownership, and G2.0 verdict
    depends_on: [C01]
    lane: control
    risk: critical
    owner_role: security_lead
    reviewer_role: milestone_reviewer
    outputs: [frozen_interface_index, ownership_matrix, g2_0_verdict]
    checks: [dag_validation, ownership_overlap_scan, scope_consistency_review]
    acceptance: []
  - id: P01
