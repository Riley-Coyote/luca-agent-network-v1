schema_version: 1
resolution_rule: TASK_GRAPH.tasks[].capsule must resolve to exactly one record below; task-local fields plus this record are
  the complete execution capsule.
task_capsules:
- id: G0
  objective: Approve source truth, feasibility and implementation contracts
  contracts: &id007
  - MILESTONE_GATES.md
  - DEMO_AND_ACCEPTANCE.md
  - SECURITY_THREAT_MODEL.md
  proofs:
  - source_truth
  - feasibility
  - contract_completeness
  source_refs:
  - target:evidence/gates
  - MILESTONE_GATES.md::universal-gate-format
  owns:
    include:
    - evidence/gates/G0/**
    - evidence/M0/G0/**
    forbid:
    - /Users/rileycoyote/clawd-luca/luca-terminal-v2/**
    - /Users/rileycoyote/Documents/Repositories/mnemos/**
    - /Users/rileycoyote/Documents/Repositories/.codex-workspaces/polyphonic-v2/**
    - '**/.env*'
    - '**/*live*mnemos*.db*'
    - Cargo.lock
    - pnpm-lock.yaml
    - '**/migrations/**'
  output_bindings:
  - name: G0_signed_verdict
    path: evidence/gates/G0/gate-verdict.json
  - name: M0_evidence_index
    path: evidence/gates/G0/M0_evidence_index.json
  - name: known_limits
    path: evidence/gates/G0/known_limits.json
  ownership_mutex: gate
  implementation_contract:
  - 'Deliver exactly these outputs: G0_signed_verdict, M0_evidence_index, known_limits.'
  - 'Prove the task-specific objective exactly: Approve source truth, feasibility and implementation contracts; stubs or narrative
    are not substitutes for the named evidence.'
  - Preserve every global invariant in TASK_GRAPH.yaml and stop on a contract contradiction.
  - Use generated/synthetic fixtures only; no live profile or source-repository mutation.
  - Persist raw command output under the task evidence directory and return only a compact summary.
  tests:
  - python3 scripts/validate_planning_kit.py
  - python3 -m unittest scripts.tests.test_validate_planning_kit -v
  evidence:
  - evidence/M0/G0/environment.json
  - evidence/M0/G0/commands.log
  - evidence/M0/G0/results.json
  - evidence/M0/G0/artifact-secret-scan.json
  - evidence/M0/G0/review.json
  verifier:
    role: lead_after_independent_review
    independent: true
    max_repair_cycles: 2
  done_when:
  - Every output bound for G0 exists at its declared owned path and is linked from results.json.
  - The focused G0 test commands pass; any milestone-only command is run by the integrator before M0 gate evaluation.
  - Observed evidence demonstrates 'Approve source truth, feasibility and implementation contracts' with no replacement by
    an unrelated fixture or unverified narrative.
  - Owned-file diff contains no forbidden path and no unapproved shared-file edit.
  - Artifact scan contains no raw key, credential, protected body or absolute local source path.
  - All P0/P1 findings are closed by evidence; accepted lower findings appear in known limits.
  effort: L
  executor_role: gate_lead
  model: gpt-5.6-sol
  reasoning_effort: ultra
  stop_conditions:
  - authority_or_egress_widens
  - conversation_depends_on_continuity
  - contract_or_owner_collision
  - live_data_required
