[profile.dev]
# Keep native crypto and large-state handling usable in development builds.
opt-level = 1
# Full file/line backtraces, no per-variable debug info. ~20-30% faster
# builds and much faster macOS link. Need lldb locals? Override per-shell:
# CARGO_PROFILE_DEV_DEBUG=2
debug = "line-tables-only"
# Reuse compiled dependencies without accumulating large incremental snapshots.
incremental = false

[profile.test]
incremental = false

[profile.release.build-override]
# The pinned Rust/LLVM can misalign stripped proc-macro dylibs, rejected by
# macOS 27 (rust-lang/rust#157750). Keep host build helpers unstripped; shipped
# binaries retain their normal release settings. Remove after a toolchain bump.
strip = "none"

[env]
# CMake 4 (pinned by hermit) removed compat with projects declaring
# cmake_minimum_required < 3.5; audiopus_sys's vendored opus declares 3.1.
# Same workaround CI uses. A value already set in the environment wins.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
