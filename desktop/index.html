<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon@2x.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <!--
      Boot background: the document must be painted before the app bundle (and
      its stylesheets) load so cold boot never flashes ahead of the loading
      gate. The window itself is also painted pre-document via `backgroundColor`
      in tauri.conf.json. The body paints its own themed background once the app
      CSS loads, so this never shows through after boot.

      The inline script below reads the cached theme background (same
      `buzz-theme-cache` entry ThemeProvider writes) and applies it synchronously
      so the boot color matches the themed loading gate — no black flash on light
      themes. On the first-ever launch it seeds the dark class to match
      Vitesse Black, the default appearance that ThemeProvider applies.

      `window.__BUZZ_FIRST_RUN__` short-circuits all of that. Native sets it
      from an init script before this document is parsed, and it is the only
      thing here that can tell a brand-new owner apart from a returning one:
      localStorage is keyed by bundle id, not by data directory, so a fresh
      profile on a Mac that already had one still finds the previous owner's
      theme and cache sitting in the store. `firstRunTheme.ts` resets those
      keys before ThemeProvider reads them; this paints the matching black so
      the reset costs no frame. Keep the key names in step with
      `shared/theme/theme-loader.ts` — this script cannot import them.
    -->
    <style>
      html {
        background-color: #000;
      }
    </style>
    <script>
      (() => {
        var cached, bg, parsed;
        // The shell's frame: on in a test app built with it, else by its
        // preview override (`shared/features/store.ts`, the newest
        // `buzz-feature-overrides-v<N>`). The main window only: a pop-out
        // keeps its own bar and glass.
        // Vite writes the build's flag in here: "1" in the beta and a test
        // app built with the frame, the placeholder itself otherwise. There
        // the classic layout (`shared/features/classicLayout.ts`) turns it off.
        var frameBuild = "%VITE_LUCA_SHELL_FRAME%";
        var shellFrameOn = () => {
          if (/[?&]window=popout(?:&|$)/.test(window.location.search)) {
            return false;
          }
          if (frameBuild === "1") {
            return window.localStorage.getItem("polyphonic-classic-layout") !== "1";
          }
          let newest = -1;
          let overrides = null;
          for (let i = 0; i < window.localStorage.length; i += 1) {
            const key = window.localStorage.key(i) || "";
            const match = /^buzz-feature-overrides-v(\d+)$/.exec(key);
            if (match && Number(match[1]) > newest) {
              newest = Number(match[1]);
              overrides = window.localStorage.getItem(key);
            }
          }
          return overrides ? JSON.parse(overrides)["shell-frame"] === true : false;
        };
        // The Frame setting's Glass, drawn as Liquid Glass (`shellGlass.ts`):
        // the native glass has announced itself and transparency is allowed.
        var liquidGlassFrame = () =>
          window.localStorage.getItem("polyphonic-frame") !== "solid" &&
          Boolean(window.__POLYPHONIC_NATIVE_GLASS__) &&
          !window.matchMedia("(prefers-reduced-transparency: reduce)").matches;
        try {
          if (window.__BUZZ_FIRST_RUN__ === true) {
            // A new owner opens in Vitesse Black (#000, dark) whatever the
            // store and the OS say. The static rule above already paints it.
            document.documentElement.classList.add("dark");
            return;
          }
          cached = window.localStorage.getItem("buzz-theme-cache");
          if (!cached) {
            // Fresh profiles start in Vitesse Black, regardless of OS scheme.
            const theme = window.localStorage.getItem("buzz-theme");
            const followSystem =
              window.localStorage.getItem("buzz-follow-system") === "true";
            if (
              (!followSystem && (!theme || theme === "vitesse-black")) ||
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.add("light");
              document.documentElement.style.backgroundColor = "#fff";
            }
            return;
          }
          parsed = JSON.parse(cached);
          bg = parsed.vars["--background"];
          if (shellFrameOn()) {
            // Under the shell's frame (preview `shell-frame`) the first paint
            // is the frame's own: clear over Apple's Liquid Glass, which
            // announces itself before this runs; otherwise the palette's
            // floor at night and its recess by day, as the loading gate
            // paints it (shell-edges.css).
            if (liquidGlassFrame()) {
              // Marked as ThemeProvider marks it, so the page's floors clear
              // from the first paint (shell-glass.css); it takes it from here.
              document.documentElement.setAttribute("data-luca-frame-glass", "liquid");
              document.documentElement.style.backgroundColor = "transparent";
              bg = null;
            } else {
              bg = parsed.vars[parsed.isDark ? "--mn-floor" : "--mn-recess"] || bg;
            }
          }
          if (bg) document.documentElement.style.backgroundColor = `hsl(${bg})`;
          // Match the cached light/dark class so themed vars resolve correctly
          // before ThemeProvider mounts.
          document.documentElement.classList.add(parsed.isDark ? "dark" : "light");
        } catch {
          /* fall back to the black default above */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
