<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity glyphs — Luca</title>
<style>
  :root {
    --floor: #060608;
    --surface: #0d0e11;
    --raised: #121317;
    --hair: rgba(255,255,255,0.09);
    --hair-strong: rgba(255,255,255,0.16);
    --ink: rgba(236,238,240,0.94);
    --ink-muted: rgba(236,238,240,0.62);
    --ink-faint: rgba(236,238,240,0.40);
    --signal: #6d93c9;
    --sans: Inter, "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    --floor: #FAF8F5;
    --surface: #ffffff;
    --raised: #f3f1ed;
    --hair: rgba(20,22,26,0.10);
    --hair-strong: rgba(20,22,26,0.20);
    --ink: rgba(22,23,26,0.92);
    --ink-muted: rgba(22,23,26,0.62);
    --ink-faint: rgba(22,23,26,0.42);
    --signal: #3D5A80;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--floor);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 380;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1120px; margin: 0 auto; padding: 4rem 2.5rem 8rem; }

  h1 {
    font-family: "Inter Tight", var(--sans);
    font-size: 2.1rem; font-weight: 400; letter-spacing: -0.021em;
    margin: 0 0 0.4rem;
  }
  h2 {
    font-family: "Inter Tight", var(--sans);
    font-size: 1.32rem; font-weight: 420; letter-spacing: -0.014em;
    margin: 0 0 0.5rem;
  }
  .lede { color: var(--ink-muted); max-width: 62ch; margin: 0 0 1rem; }
  .blurb { color: var(--ink-faint); max-width: 68ch; margin: 0 0 2rem; font-size: 0.92rem; }
  .eyebrow {
    font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.13em; color: var(--ink-faint); margin: 0 0 0.5rem;
  }
  section { padding: 3.25rem 0 0; border-top: 1px solid var(--hair); margin-top: 3.25rem; }
  section:first-of-type { border-top: none; }

  /* controls */
  .bar { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 2.5rem; }
  .barLabel {
    font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-faint);
  }
  .ctl {
    font-family: var(--sans); font-size: 0.82rem; font-weight: 400;
    color: var(--ink-muted); background: var(--raised);
    border: 1px solid var(--hair); border-radius: 7px;
    padding: 0.32rem 0.8rem; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    transition: color 130ms ease, border-color 130ms ease;
  }
  .ctl:hover { color: var(--ink); }
  .ctl:focus-visible { outline: none; border-color: rgba(255,255,255,0.5); }

  /* 1. ladder */
  .ladderWrap { margin-bottom: 2rem; }
  .seedName {
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0 0 0.7rem;
  }
  .ladder { display: flex; align-items: flex-end; gap: 1.6rem; flex-wrap: wrap; }
  .rung { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .px { font-family: var(--mono); font-size: 0.6rem; color: var(--ink-faint); }

  /* 2. compare */
  .compare { display: flex; gap: 1.75rem; flex-wrap: wrap; }
  .cmpCol { display: flex; flex-direction: column; align-items: center; gap: 0.85rem; }
  .cmpCell {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.7rem 0.85rem; border: 1px solid var(--hair);
    border-radius: 9px; background: var(--surface);
  }
  .cmpCol .cmpCell:first-child { border-style: dashed; opacity: 0.85; }

  /* 3. chat */
  .thread {
    background: var(--surface); border: 1px solid var(--hair);
    border-radius: 11px; padding: 0.5rem 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .msg { display: flex; gap: 0.75rem; padding: 0.62rem 1.1rem; align-items: flex-start; }
  .msg:hover { background: rgba(255,255,255,0.022); }
  .av { padding-top: 1px; }
  .msgBody { min-width: 0; }
  .msgHead { display: flex; align-items: baseline; gap: 0.55rem; }
  .author { font-size: 0.95rem; font-weight: 480; color: var(--ink); }
  .time { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-faint); }
  .msgText { margin: 0.1rem 0 0; font-size: 0.95rem; color: var(--ink-muted); }

  /* 4. rail */
  .railWrap { display: flex; gap: 1.5rem; align-items: flex-start; }
  .rail {
    width: 232px; background: var(--surface); border: 1px solid var(--hair);
    border-radius: 11px; padding: 0.45rem;
  }
  .railItem {
    display: flex; align-items: center; gap: 0.62rem;
    padding: 0.36rem 0.5rem; border-radius: 7px;
    font-size: 0.9rem; color: var(--ink-muted);
  }
  .railItem:hover { background: rgba(255,255,255,0.03); color: var(--ink); }
  .iconRail {
    width: 48px; background: var(--surface); border: 1px solid var(--hair);
    border-radius: 11px; padding: 0.45rem; display: flex;
    flex-direction: column; align-items: center; gap: 0.28rem;
  }
  .iconItem { padding: 0.3rem; border-radius: 7px; display: flex; }
  .iconItem:hover { background: rgba(255,255,255,0.03); }

  /* 4b. pixel truth */
  .truthGrid { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }
  .truthCol { display: flex; flex-direction: column; align-items: center; gap: 0.85rem; }
  .truthCol canvas { display: block; background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; }

  /* 5. family */
  .family {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 0.55rem;
  }
  .famCell {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1; border: 1px solid var(--hair); border-radius: 9px;
    background: var(--surface);
  }
  .famCell:hover { border-color: var(--hair-strong); }

  /* 6. audit */
  .audit { border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; max-width: 520px; }
  .auditRow {
    display: flex; justify-content: space-between; gap: 2rem;
    padding: 0.62rem 1rem; border-bottom: 1px solid var(--hair);
    background: var(--surface);
  }
  .auditRow:last-child { border-bottom: none; }
  .auditKey { color: var(--ink-faint); font-size: 0.88rem; }
  .auditVal { font-family: var(--mono); font-size: 0.8rem; color: var(--ink); }

  footer {
    margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--hair);
    color: var(--ink-faint); font-size: 0.8rem;
  }
  code { font-family: var(--mono); font-size: 0.86em; color: var(--ink-muted); }
</style>
</head>
<body>
<div style="max-width:1120px;margin:0 auto;padding:4rem 2.5rem 0">
  <h1>Identity glyphs</h1>
  <p class="lede">
    A resident's mark, derived from their public key — grown as a connected
    stroke figure on a 7&times;7 lattice, and drawn with one geometry from
    112&nbsp;px down to 16&nbsp;px.
  </p>
</div>
<div id="app"></div>
<div style="max-width:1120px;margin:0 auto;padding:0 2.5rem 6rem">
  <footer>
    Running <code>identity/glyph.ts</code> and <code>identity/render.ts</code>
    from the repository, bundled. Rebuild with <code>just glyph-lab</code>.
  </footer>
</div>
<script>__BUNDLE__</script>
</body>
</html>
