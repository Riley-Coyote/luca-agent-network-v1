<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink in water — lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; font: 14px/1.4 "Inter Variable", Inter, system-ui, sans-serif; }
  .pane { position: absolute; inset: 10px 10px 10px 270px; border-radius: 12px; overflow: hidden; background: rgb(16 16 16); }
  .pane.light { background: rgb(246 245 242); color: #1a1a1a; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, 80%); text-align: center; }
  .name { font: 500 22px/1.25 "Instrument Sans Variable", "Instrument Sans", sans-serif; letter-spacing: -0.02em; margin: 0 0 4px; }
  .role { color: rgb(160 160 160); margin: 0 0 18px; }
  .composer { background: rgb(22 22 22); border-radius: 26px; padding: 14px 20px; text-align: left; min-height: 24px; outline: none; color: #f2f2f2; }
  .light .composer { background: rgb(232 231 228); color: #1a1a1a; }
  .controls { position: absolute; left: 14px; top: 14px; width: 240px; display: grid; gap: 8px; color: #aaa; }
  button { background: #1d1d1d; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 6px 10px; }
</style>
</head>
<body>
<div class="controls">
  <button id="send" type="button">Send (release)</button>
  <button id="theme" type="button">Light / dark</button>
  <button id="reset" type="button">Reset water</button>
  <div id="stats"></div>
</div>
<div class="pane" id="pane">
  <canvas id="ink"></canvas>
  <div class="center" id="center">
    <p class="name">Luca</p>
    <p class="role">Your companion</p>
    <div class="composer" id="composer" contenteditable="true" aria-label="Message Luca"></div>
  </div>
</div>
<script type="module">
  import { InkWaterEngine } from "/src/shared/ui/ink-water/inkWaterEngine.ts";
  import { waterPalette, paintIndexForWord, varyInk } from "/src/shared/ui/ink-water/inkPaints.ts";

  const pane = document.getElementById("pane");
  const canvas = document.getElementById("ink");
  const composer = document.getElementById("composer");
  const palette = waterPalette();
  let engine;
  let words = 0;
  let beads = 0;

  function surface() {
    const [r, g, b] = getComputedStyle(pane).backgroundColor.match(/\d+/g).map(Number);
    return [r / 255, g / 255, b / 255];
  }
  function toUnit(x, y) {
    const r = canvas.getBoundingClientRect();
    return [(x - r.left) / r.width, 1 - (y - r.top) / r.height];
  }
  function quiet() {
    const r = canvas.getBoundingClientRect();
    const c = document.getElementById("center").getBoundingClientRect();
    const [x, y] = toUnit(c.left + c.width / 2, c.top + c.height * 0.25);
    engine.setQuiet(x, y, (c.width / r.width) * 0.42, (c.height / r.height) * 0.9);
  }
  function start() {
    engine?.dispose();
    engine = InkWaterEngine.create(canvas);
    if (!engine) { document.getElementById("stats").textContent = "no WebGL2 float targets"; return; }
    engine.configure(surface(), palette);
    quiet();
    const t0 = performance.now();
    engine.warm(4.5);
    document.getElementById("stats").textContent = `warm ${(performance.now() - t0).toFixed(0)} ms`;
  }
  start();

  let last = performance.now();
  let born = last;
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const fade = Math.min(1, (now - born) / 1400);
    engine?.frame(dt, 1 - (1 - fade) ** 3);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  let px = 0, py = 0;
  pane.addEventListener("pointermove", (e) => {
    const [x, y] = toUnit(e.clientX, e.clientY);
    if (px) engine?.stir(x, y, x - px, y - py);
    px = x; py = y;
  });

  composer.addEventListener("input", (e) => {
    if (!engine || (e.inputType && e.inputType.startsWith("delete"))) return;
    const typed = e.data ?? "";
    if (/\s/.test(typed)) { words += 1; return; }
    const sel = window.getSelection();
    let rect = sel && sel.rangeCount ? sel.getRangeAt(0).getBoundingClientRect() : null;
    if (!rect || (!rect.width && !rect.height)) rect = composer.getBoundingClientRect();
    const [x, y] = toUnit(rect.right, composer.getBoundingClientRect().bottom);
    beads += 1;
    engine.drop(x, y - 0.01, varyInk(palette[paintIndexForWord(words, palette.length)], beads), 1);
  });

  document.getElementById("send").onclick = () => {
    const r = composer.getBoundingClientRect();
    const [x, y] = toUnit(r.left + r.width / 2, r.bottom);
    const w = r.width / canvas.getBoundingClientRect().width;
    engine?.release(x, y - 0.01, w * 0.8);
    composer.textContent = "";
  };
  document.getElementById("theme").onclick = () => { pane.classList.toggle("light"); engine?.configure(surface(), palette); };
  document.getElementById("reset").onclick = () => { born = performance.now(); start(); };
  new ResizeObserver(() => { engine?.resize(); engine && quiet(); }).observe(canvas);
  window.inkLab = { get engine() { return engine; }, palette, toUnit };
</script>
</body>
</html>
