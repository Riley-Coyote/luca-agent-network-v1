<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dot-display gallery</title>
    <style>
      body {
        background: #08090c;
        color: #e6e8ea;
        font: 13px/1.5 Inter, system-ui, sans-serif;
        margin: 0;
        padding: 28px;
      }
      h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
      p.sub { color: #8b9096; margin: 0 0 24px; font-size: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; }
      .cellbox { text-align: center; }
      .cellbox canvas { border-radius: 5px; border: 1px solid #2b2e31; }
      .cap { color: #8b9096; font-size: 10px; letter-spacing: .08em;
             text-transform: uppercase; margin-top: 6px; }
      h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
           color: #6b7076; font-weight: 500; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <h1>dot-display — scene gallery</h1>
    <p class="sub">Real engine module, served by vite. Top row is rail scale (28px).</p>

    <h2>28px — avatar / rail scale, where it has to work</h2>
    <div class="row" id="small"></div>

    <h2>96px — same scenes, larger lattice</h2>
    <div class="row" id="large"></div>

    <h2>Identity determinism — four keys, rendered twice</h2>
    <div class="row" id="ident"></div>

    <script type="module">
      import { registerPanel, __dotDisplayStats } from "/src/shared/ui/dot-display/engine.ts";

      const SCENES = ["sigil", "listen", "think", "recall", "work", "net", "sleep", "pulse", "fault"];
      const SEED = "35653885e1eeb9c1a0759c24b502f6105714f0198ee83d04468b9905752ec899";

      function make(host, scene, size, cell, seed, breath) {
        const box = document.createElement("div");
        box.className = "cellbox";
        const cv = document.createElement("canvas");
        cv.width = size; cv.height = size;
        cv.style.width = size + "px"; cv.style.height = size + "px";
        cv.dataset.scene = scene;
        box.appendChild(cv);
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = scene;
        box.appendChild(cap);
        host.appendChild(box);
        registerPanel(cv, { seed, cell, breath });
      }

      for (const s of SCENES) make(document.getElementById("small"), s, 28, 2, SEED, s === "sigil");
      for (const s of SCENES) make(document.getElementById("large"), s, 96, 4, SEED, s === "sigil");

      const keys = ["alpha-key", "beta-key", "gamma-key", "delta-key"];
      for (const k of [...keys, ...keys]) make(document.getElementById("ident"), "sigil", 28, 2, k, false);

      window.__stats = __dotDisplayStats;
    </script>
  </body>
</html>
