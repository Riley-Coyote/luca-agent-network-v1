<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark engine — harness</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #07070a; color: rgba(255,255,255,.95);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 24px 80px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  p.sub { margin: 0; max-width: 620px; text-align: center; color: rgba(255,255,255,.45); font-size: 12px; }
  #stage {
    position: relative; width: 880px; height: 660px; border-radius: 22px;
    border: .5px solid rgba(255,255,255,.09);
    background: radial-gradient(120% 100% at 30% 12%, #14151a 0%, #0b0b0f 52%, #07070a 100%);
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 880px; height: 660px; display: block; }
  #hud {
    position: absolute; left: 20px; bottom: 16px; display: flex; gap: 9px; align-items: center;
    font-size: 10.5px; letter-spacing: .04em; color: rgba(255,255,255,.46);
  }
  #dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3); }
  #pct { position: absolute; right: 20px; bottom: 16px; font-size: 10.5px; color: rgba(255,255,255,.32); }
  #bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 880px; }
  button {
    font: inherit; font-size: 11.5px; color: rgba(255,255,255,.62); cursor: pointer;
    padding: 8px 14px; border-radius: 999px; background: transparent;
    border: .5px solid rgba(255,255,255,.13);
  }
  button:hover { color: #fff; border-color: rgba(255,255,255,.32); }
  button[aria-pressed="true"] { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.26); color: #fff; }
  .sep { width: 1px; height: 20px; background: rgba(255,255,255,.1); }
</style>
</head>
<body>
  <h1>Mark engine — harness</h1>
  <p class="sub">Serve this folder over HTTP (<code>npx serve</code>) — it uses ES modules, so <code>file://</code> will not work. Everything you see is <code>mark-engine.js</code> replaying the op array returned by <code>subjects/flower.js</code>.</p>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"><div id="dot"></div><div id="phase">Ready</div></div>
    <div id="pct"></div>
  </div>

  <div id="bar">
    <button id="replay">Draw it again</button>
    <button id="finish">Jump to finished</button>
    <div class="sep"></div>
    <button class="sp" data-v="1">1×</button>
    <button class="sp" data-v="2" aria-pressed="true">2×</button>
    <button class="sp" data-v="6">6×</button>
    <div class="sep"></div>
    <button class="ly" data-k="under" aria-pressed="true">Underdrawing</button>
    <button class="ly" data-k="tone" aria-pressed="true">Tone</button>
    <button class="ly" data-k="line" aria-pressed="true">Line</button>
    <button class="ly" data-k="accent" aria-pressed="true">Accent</button>
    <div class="sep"></div>
    <button id="dump">Log page as JSON</button>
  </div>

<script type="module">
import { MarkEngine } from './mark-engine.js';
import { buildFlower, FLOWER } from './subjects/flower.js';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const engine = new MarkEngine({ width: FLOWER.page.w, height: FLOWER.page.h, dpr: 2 });
cv.width = FLOWER.page.w * 2;
cv.height = FLOWER.page.h * 2;

const ops = buildFlower(FLOWER);
engine.load(ops).replay();

/* Exposed on purpose: poke at it in devtools.
 *   engine.finish()            draw the whole page instantly
 *   engine.ops.length          how many marks this page is
 *   engine.toDataURL()         flatten for a thumbnail  */
window.engine = engine;
window.ops = ops;

let speed = 2;
const hidden = {};

const phaseEl = document.getElementById('phase');
const pctEl = document.getElementById('pct');
const dotEl = document.getElementById('dot');

document.getElementById('replay').onclick = () => engine.replay();
document.getElementById('finish').onclick = () => engine.finish();
document.getElementById('dump').onclick = () => {
  const json = JSON.stringify(ops);
  console.log(`page is ${ops.length} ops, ${(json.length / 1024).toFixed(1)} kB of JSON`);
  console.log(json.slice(0, 800) + '…');
};
document.querySelectorAll('.sp').forEach((b) => {
  b.onclick = () => {
    speed = +b.dataset.v;
    document.querySelectorAll('.sp').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  };
});
document.querySelectorAll('.ly').forEach((b) => {
  b.onclick = () => {
    const k = b.dataset.k;
    hidden[k] = !hidden[k];
    b.setAttribute('aria-pressed', String(!hidden[k]));
  };
});

let last = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  engine.tick(dt, speed);
  engine.composite(ctx, hidden);

  if (engine.pen) {
    ctx.save();
    ctx.scale(2, 2);
    ctx.beginPath();
    ctx.moveTo(engine.pen.x, engine.pen.y - 4);
    ctx.lineTo(engine.pen.x - 4, engine.pen.y - 24);
    ctx.lineTo(engine.pen.x + 4, engine.pen.y - 24);
    ctx.closePath();
    ctx.fillStyle = 'rgba(226,238,255,.8)';
    ctx.fill();
    ctx.restore();
  }

  const drawing = !!engine.cursor;
  phaseEl.textContent = engine.phase || (engine.done ? 'Finished — 4 layers, 7 brushes' : 'Ready');
  pctEl.textContent = drawing ? Math.round(engine.progress * 100) + '%' : engine.done ? ops.length + ' ops' : '';
  dotEl.style.background = drawing ? 'rgb(150,205,255)' : 'rgba(255,255,255,.3)';
}
frame();
</script>
</body>
</html>
