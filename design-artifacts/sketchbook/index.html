<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchbook</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #07070a;
    --leaf: radial-gradient(120% 100% at 30% 12%, #14151a 0%, #0b0b0f 52%, #07070a 100%);
    --hair: rgba(255,255,255,.08);
    --hair-2: rgba(255,255,255,.13);
    --ink: rgb(236,243,255);
    --live: rgb(150,205,255);
    --t1: rgba(255,255,255,.92);
    --t2: rgba(255,255,255,.55);
    --t3: rgba(255,255,255,.42);
    --t4: rgba(255,255,255,.32);
    --sel: rgba(255,255,255,.06);
    --r: 22px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--t1);
    font: 13px/1.65 var(--font); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 236px 1fr;
    grid-template-areas: "bar bar" "spine spread";
    overflow: hidden;
  }
  button { font: inherit; color: var(--t2); cursor: pointer; background: transparent; border: .5px solid var(--hair-2); border-radius: 999px; padding: 7px 13px; font-size: 11.5px; }
  button:hover { color: var(--t1); border-color: rgba(255,255,255,.32); }
  button:focus-visible { outline: none; border-color: rgba(255,255,255,.5); }
  button[aria-pressed="true"] { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.26); color: var(--t1); }
  button:disabled { opacity: .35; cursor: default; }
  .label { font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--t4); }

  /* ---- top bar */
  #bar { grid-area: bar; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-bottom: .5px solid var(--hair); }
  #bar h1 { font-size: 15px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  #bar .meta { color: var(--t3); font-size: 11px; }
  #bar .spacer { flex: 1; }

  /* ---- spine */
  #spine { grid-area: spine; overflow-y: auto; border-right: .5px solid var(--hair); padding: 12px 8px 40px; }
  .row { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 8px 10px; border-radius: 12px; cursor: pointer; align-items: start; color: var(--t2); }
  .row:hover { background: rgba(255,255,255,.035); }
  .row[aria-current="page"] { background: var(--sel); color: var(--t1); }
  .row .n { font-size: 11px; color: var(--t4); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .row .thumb { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: #0b0b0f; border: .5px solid var(--hair); display: block; overflow: hidden; }
  .row .thumb img { width: 100%; height: 100%; display: block; }
  .row .t { font-size: 12px; margin-top: 6px; line-height: 1.35; }
  .row .d { font-size: 10.5px; color: var(--t4); }
  .row.blank { color: var(--t4); cursor: default; }
  .row.blank .thumb { border-style: dashed; }
  .row.blank:hover { background: transparent; }
  .chip { display: inline-block; font-size: 9.5px; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; border: .5px solid var(--hair-2); color: var(--t3); margin-left: 6px; vertical-align: 1px; }
  .chip.live { color: var(--live); border-color: rgba(150,205,255,.35); }
  .blank-count { padding: 14px 12px 0; font-size: 11px; color: var(--t4); }

  /* ---- spread */
  #spread { grid-area: spread; overflow: auto; padding: 26px 28px 40px; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 26px; align-content: start; }
  #left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  #left .pn { font-size: 11px; color: var(--t4); font-variant-numeric: tabular-nums; }
  #left h2 { font-size: 29px; font-weight: 600; letter-spacing: -.026em; line-height: 1.1; margin: 4px 0 0; }
  #left .date { color: var(--t3); font-size: 11px; margin-top: 4px; }
  #left .note { color: var(--t2); white-space: pre-wrap; }
  #left .refs a { color: var(--t1); text-decoration: none; border-bottom: .5px solid var(--hair-2); cursor: pointer; }
  .strip { display: flex; gap: 8px; flex-wrap: wrap; }
  .strip .att { width: 84px; cursor: pointer; }
  .strip .att .thumb { width: 84px; height: 63px; border-radius: 6px; border: .5px solid var(--hair); overflow: hidden; background: #0b0b0f; }
  .strip .att .thumb img { width: 100%; height: 100%; display: block; }
  .strip .att[aria-current="page"] .thumb { border-color: rgba(255,255,255,.4); }
  .strip .att .c { font-size: 10px; color: var(--t4); margin-top: 3px; text-align: center; }
  #source { display: none; font: 11px/1.5 var(--mono); color: var(--t3); background: rgba(255,255,255,.025); border: .5px solid var(--hair); border-radius: 12px; padding: 12px 14px; max-height: 420px; overflow: auto; white-space: pre; }
  #source.open { display: block; }

  #right { min-width: 0; }
  #stage { position: relative; width: 100%; max-width: 880px; aspect-ratio: 880 / 660; border-radius: var(--r); border: .5px solid rgba(255,255,255,.09); background: var(--leaf); overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 20px; bottom: 16px; display: flex; gap: 9px; align-items: center; font-size: 10.5px; letter-spacing: .04em; color: var(--t3); }
  #dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3); transition: background .3s; }
  #pct { position: absolute; right: 20px; bottom: 16px; font-size: 10.5px; color: var(--t4); font-variant-numeric: tabular-nums; }
  #controls { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .sep { width: 1px; height: 18px; background: var(--hair); margin: 0 4px; }
  #empty { color: var(--t3); padding: 40px 0; }

  @media (prefers-reduced-motion: reduce) { #dot { transition: none; } }
</style>
</head>
<body>
  <div id="bar">
    <h1 id="book-title">Sketchbook</h1>
    <span class="meta" id="book-meta"></span>
    <span class="spacer"></span>
    <span class="label" id="owner"></span>
  </div>
  <nav id="spine" aria-label="pages"></nav>
  <main id="spread">
    <section id="left">
      <div>
        <div class="pn" id="pn"></div>
        <h2 id="title"></h2>
        <div class="date" id="date"></div>
      </div>
      <div>
        <div class="label">note</div>
        <div class="note" id="note"></div>
      </div>
      <div id="refs-wrap" hidden>
        <div class="label">reworks</div>
        <div class="refs" id="refs"></div>
      </div>
      <div id="attempts-wrap" hidden>
        <div class="label" style="margin-bottom:8px">this subject, across the book</div>
        <div class="strip" id="attempts"></div>
      </div>
      <div>
        <button id="src-toggle" aria-pressed="false">Show the marks</button>
        <div class="meta" id="src-meta" style="display:inline-block;margin-left:10px;font-size:11px;color:var(--t4)"></div>
        <pre id="source"></pre>
      </div>
    </section>
    <section id="right">
      <div id="stage">
        <canvas id="cv" width="1760" height="1320"></canvas>
        <div id="hud"><div id="dot"></div><div id="phase">Ready</div></div>
        <div id="pct"></div>
      </div>
      <div id="controls">
        <button id="replay">Draw it again</button>
        <button id="finish">Jump to finished</button>
        <div class="sep"></div>
        <button class="sp" data-v="1">1×</button>
        <button class="sp" data-v="3" aria-pressed="true">3×</button>
        <button class="sp" data-v="8">8×</button>
      </div>
    </section>
  </main>

<script type="module">
import { MarkEngine } from './mark-engine.js';

const $ = (id) => document.getElementById(id);
const book = await (await fetch('./book/book.json?' + Date.now())).json();
const pageCache = new Map();
const thumbCache = new Map();

$('book-title').textContent = book.title;
$('owner').textContent = book.owner;
const drawn = book.pages.length;
$('book-meta').textContent = `${drawn} of ${book.pageCount} pages drawn`;

async function loadPage(meta) {
  if (!pageCache.has(meta.index)) {
    pageCache.set(meta.index, fetch('./book/' + meta.file).then((r) => r.json()));
  }
  return pageCache.get(meta.index);
}

/* thumbnails: flattened on demand from the marks. cached in memory. */
async function thumb(meta) {
  if (thumbCache.has(meta.index)) return thumbCache.get(meta.index);
  const p = loadPage(meta).then((page) => {
    const e = new MarkEngine({ width: 880, height: 660, dpr: 0.3 });
    e.load(page.ops).finish();
    return e.toDataURL();
  });
  thumbCache.set(meta.index, p);
  return p;
}

/* ---- lineage: pages that rework each other form one subject */
const byIndex = new Map(book.pages.map((p) => [p.index, p]));
function lineage(meta) {
  const seen = new Set();
  const walk = (m) => {
    if (!m || seen.has(m.index)) return;
    seen.add(m.index);
    (m.refs || []).forEach((r) => walk(byIndex.get(r)));
    book.pages.filter((q) => (q.refs || []).includes(m.index)).forEach(walk);
  };
  walk(meta);
  return [...seen].sort((a, b) => a - b).map((i) => byIndex.get(i));
}

/* ---- spine */
const spine = $('spine');
const rows = new Map();
for (const meta of book.pages) {
  const row = document.createElement('div');
  row.className = 'row';
  row.setAttribute('role', 'link');
  row.tabIndex = 0;
  const reworks = meta.refs?.length ? `<span class="chip">↺ ${meta.refs.join(', ')}</span>` : '';
  row.innerHTML = `<div class="n">${meta.index}</div><div><div class="thumb"><img alt=""></div><div class="t">${esc(meta.title)}${reworks}</div><div class="d">${meta.date}</div></div>`;
  row.onclick = () => open(meta.index, true);
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(meta.index, true); } };
  spine.appendChild(row);
  rows.set(meta.index, row);
  thumb(meta).then((url) => { row.querySelector('img').src = url; });
}
const blank = book.pageCount - drawn;
if (blank > 0) {
  const next = document.createElement('div');
  next.className = 'row blank';
  next.innerHTML = `<div class="n">${drawn + 1}</div><div><div class="thumb"></div><div class="t">blank</div></div>`;
  spine.appendChild(next);
  const c = document.createElement('div');
  c.className = 'blank-count';
  c.textContent = `${blank} blank page${blank === 1 ? '' : 's'} remain`;
  spine.appendChild(c);
}

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

/* ---- the open spread */
const cv = $('cv');
const ctx = cv.getContext('2d');
const engine = new MarkEngine({ width: 880, height: 660, dpr: 2 });
let ops = [];
let speed = 3;
let current = null;
const seenKey = 'sketchbook:' + book.id + ':seen';
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem(seenKey) || '[]')); } catch {}
function markSeen(i) { seen.add(i); try { localStorage.setItem(seenKey, JSON.stringify([...seen])); } catch {} }

async function open(index, push) {
  const meta = byIndex.get(index);
  if (!meta) return;
  current = meta;
  rows.forEach((r, i) => r.setAttribute('aria-current', i === index ? 'page' : 'false'));
  rows.get(index)?.scrollIntoView({ block: 'nearest' });
  if (push) history.replaceState(null, '', '#' + index);

  const page = await loadPage(meta);
  if (current !== meta) return;
  ops = page.ops;
  engine.load(ops);
  /* a page animates the first time you reach it, and is flat thereafter */
  if (seen.has(index)) engine.finish(); else { engine.replay(); markSeen(index); }

  $('pn').textContent = `page ${meta.index} of ${book.pageCount}`;
  $('title').textContent = meta.title;
  $('date').textContent = meta.date;
  $('note').textContent = meta.note;

  const refsWrap = $('refs-wrap');
  const laterRefs = book.pages.filter((q) => (q.refs || []).includes(index));
  if ((meta.refs || []).length || laterRefs.length) {
    refsWrap.hidden = false;
    const parts = [];
    if (meta.refs?.length) parts.push('reworks ' + meta.refs.map((r) => `<a data-go="${r}">page ${r}</a>`).join(', '));
    if (laterRefs.length) parts.push('reworked on ' + laterRefs.map((q) => `<a data-go="${q.index}">page ${q.index}</a>`).join(', '));
    $('refs').innerHTML = parts.join('<br>');
    $('refs').querySelectorAll('a').forEach((a) => (a.onclick = () => open(Number(a.dataset.go), true)));
  } else refsWrap.hidden = true;

  const lin = lineage(meta);
  const attWrap = $('attempts-wrap');
  if (lin.length > 1) {
    attWrap.hidden = false;
    const strip = $('attempts');
    strip.innerHTML = '';
    lin.forEach((m, k) => {
      const a = document.createElement('div');
      a.className = 'att';
      a.setAttribute('aria-current', m.index === index ? 'page' : 'false');
      a.innerHTML = `<div class="thumb"><img alt=""></div><div class="c">${k + 1} · p.${m.index}</div>`;
      a.onclick = () => open(m.index, true);
      strip.appendChild(a);
      thumb(m).then((url) => (a.querySelector('img').src = url));
    });
  } else attWrap.hidden = true;

  $('source').textContent = page.source;
  $('src-meta').textContent = `${ops.length} marks · ${(JSON.stringify(ops).length / 1024).toFixed(0)} kB · ${meta.module || ''}`;
}

$('replay').onclick = () => engine.replay();
$('finish').onclick = () => engine.finish();
$('src-toggle').onclick = () => {
  const open = $('source').classList.toggle('open');
  $('src-toggle').setAttribute('aria-pressed', String(open));
  $('src-toggle').textContent = open ? 'Hide the marks' : 'Show the marks';
};
document.querySelectorAll('.sp').forEach((b) => {
  b.onclick = () => { speed = +b.dataset.v; document.querySelectorAll('.sp').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); };
});
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (!current) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { const n = byIndex.get(current.index + 1); if (n) open(n.index, true); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { const n = byIndex.get(current.index - 1); if (n) open(n.index, true); }
});

const phaseEl = $('phase'), pctEl = $('pct'), dotEl = $('dot');
let last = performance.now();
(function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  engine.tick(dt, speed);
  engine.composite(ctx);
  if (engine.pen) {
    ctx.save(); ctx.scale(2, 2);
    ctx.beginPath();
    ctx.moveTo(engine.pen.x, engine.pen.y - 4);
    ctx.lineTo(engine.pen.x - 4, engine.pen.y - 24);
    ctx.lineTo(engine.pen.x + 4, engine.pen.y - 24);
    ctx.closePath();
    ctx.fillStyle = 'rgba(226,238,255,.8)';
    ctx.fill();
    ctx.restore();
  }
  const drawing = !!engine.cursor;
  phaseEl.textContent = engine.phase || (engine.done ? 'Finished' : 'Ready');
  pctEl.textContent = drawing ? Math.round(engine.progress * 100) + '%' : engine.done ? ops.length + ' marks' : '';
  dotEl.style.background = drawing ? 'rgb(150,205,255)' : 'rgba(255,255,255,.3)';
})();

/* expose for devtools and tests */
window.book = book; window.engine = engine; window.openPage = open;

const hash = Number(location.hash.slice(1));
if (book.pages.length) open(byIndex.has(hash) ? hash : book.pages[book.pages.length - 1].index, false);
</script>
</body>
</html>
