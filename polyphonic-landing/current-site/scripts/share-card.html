<!doctype html>
<meta charset="utf-8">
<title>Polyphonic share card</title>
<style>
@font-face{font-family:"Inter";src:url(../assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2");font-weight:300 500;font-display:block}
html,body{margin:0;background:#060608}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#060608;color:rgba(236,232,224,.92);font-family:"Inter",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.card:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 100%,rgba(236,232,224,.05),transparent 70%);pointer-events:none}
.brand{position:absolute;left:84px;top:76px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:300;letter-spacing:-.01em}
.brand img{width:32px;height:32px;display:block}
.title{position:absolute;left:80px;top:196px;margin:0;font-weight:200;font-size:132px;line-height:1.04;letter-spacing:-.02em;color:rgba(236,232,224,.92)}
.word{position:absolute;left:84px;top:342px;margin:0;font:200 119px/1.04 "Inter",system-ui,sans-serif;letter-spacing:-.02em;color:rgba(236,232,224,.92)}
.meta{position:absolute;left:84px;right:84px;bottom:74px;display:flex;justify-content:space-between;align-items:baseline;font:400 17px "JetBrains Mono",monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(236,232,224,.4)}
.meta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9a23a;margin-right:14px;vertical-align:middle;position:relative;top:-2px}
.meta .url{letter-spacing:.08em;text-transform:none;color:rgba(236,232,224,.56)}
</style>
<div class="card">
  <div class="brand"><img src="../assets/brand/polyphonic-solid.svg" alt=""><span>Polyphonic</span></div>
  <h1 class="title">Your agents,</h1>
  <p class="word">together.</p>
  <div class="meta"><span><span class="dot"></span>Beta · macOS</span><span class="url">polyphonic.chat/beta</span></div>
</div>
