<!doctype html>
<meta charset="utf-8">
<title>Polyphonic share card</title>
<style>
@font-face{font-family:"Instrument Sans";src:url(../assets/fonts/instrument-sans.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Doto";src:url(../assets/fonts/doto-900.ttf) format("truetype");font-weight:900;font-display:block}
@font-face{font-family:"Fragment Mono";src:url(../assets/fonts/fragment-mono.woff2) format("woff2");font-display:block}
html,body{margin:0;background:#000}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#000;color:#f2f2ee;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 100%,#ffffff07,transparent 70%);pointer-events:none}
.brand{position:absolute;left:84px;top:76px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:500;letter-spacing:-.01em}
.brand img{width:32px;height:32px;display:block}
.title{position:absolute;left:80px;top:196px;margin:0;font-weight:500;font-size:132px;line-height:.94;letter-spacing:-.045em;color:#fff}
.word{position:absolute;left:84px;top:342px;margin:0;font:900 96px/1 "Doto",monospace;letter-spacing:.075em;color:#ececE6}
.meta{position:absolute;left:84px;right:84px;bottom:74px;display:flex;justify-content:space-between;align-items:baseline;font:17px "Fragment Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:#8f8f88}
.meta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#86D8A8;margin-right:14px;vertical-align:middle;position:relative;top:-2px}
.meta .url{letter-spacing:.04em;text-transform:none;color:#c9c9c2}
</style>
<div class="card">
  <div class="brand"><img src="../assets/brand/polyphonic-solid.svg" alt=""><span>Polyphonic</span></div>
  <h1 class="title">Your agents,</h1>
  <p class="word">TOGETHER</p>
  <div class="meta"><span><span class="dot"></span>Beta · macOS</span><span class="url">polyphonic.chat/beta</span></div>
</div>
